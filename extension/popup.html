<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobTrail</title>
    <link rel="stylesheet" href="./src/popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="brand">JobTrail</span>
      <!-- Only the name is cut when it does not fit; the tooltip then shows it whole. -->
      <span id="user-greeting" class="user" hidden
        >Welcome, <span id="user-name" class="user-name"></span
      ></span>
      <button id="logout-button" class="link-button" type="button" hidden>Log out</button>
    </header>

    <main>
      <p id="loading" class="muted">Loading...</p>

      <!-- Shown when there is no session. -->
      <form id="login-view" class="stack" hidden>
        <h1>Sign in</h1>
        <label>
          Email
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button id="login-button" type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>

      <!-- Shown when signed in: what was found on the page and the Save button. -->
      <section id="job-view" class="stack" hidden>
        <p id="job-message" class="muted"></p>
        <!-- Shown when the page has no job data to read: opens the same form, empty. -->
        <button id="manual-button" class="link-button" type="button" hidden>
          Enter it manually
        </button>

        <!-- Shown instead of the form when this job looks already saved. -->
        <p id="duplicate-warning" class="warning" role="status" hidden></p>
        <button id="proceed-button" type="button" hidden>Save anyway</button>

        <!-- The job found on the page. Every field can be fixed before saving. -->
        <form id="job-form" class="stack" novalidate hidden>
          <h1>Check the job before saving</h1>
          <label>
            <span>Title <span class="required-mark" aria-hidden="true">*</span></span>
            <input id="job-title" type="text" autocomplete="off" />
            <span id="job-title-error" class="field-error" hidden></span>
          </label>
          <label>
            <span>Company <span class="required-mark" aria-hidden="true">*</span></span>
            <input id="job-company" type="text" autocomplete="off" />
            <span id="job-company-error" class="field-error" hidden></span>
          </label>
          <label>
            Location
            <input id="job-location" type="text" autocomplete="off" />
            <span id="job-location-error" class="field-error" hidden></span>
          </label>
          <label>
            Salary
            <input id="job-salaryRange" type="text" autocomplete="off" />
            <span id="job-salaryRange-error" class="field-error" hidden></span>
          </label>
          <label>
            Link
            <input id="job-url" type="url" autocomplete="off" />
            <span id="job-url-error" class="field-error" hidden></span>
          </label>
          <label>
            Description
            <textarea id="job-description" rows="4"></textarea>
            <span id="job-description-error" class="field-error" hidden></span>
          </label>
          <button id="save-button" type="submit">Save to board</button>
        </form>

        <p id="job-error" class="error" role="alert" hidden></p>
        <a id="board-link" class="board-link" target="_blank" rel="noreferrer" hidden
          >Open my board</a
        >
      </section>
    </main>

    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
